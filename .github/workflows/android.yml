name: Build Android Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Prepare www (webDir)
        run: npm run prepare:www

      - name: Add Capacitor Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Patch Android (package, icons, permissions)
        run: |
          chmod +x android-patches/patch-android.sh
          bash android-patches/patch-android.sh

      - name: Verify package + icons + mic
        run: |
          grep -n "RECORD_AUDIO" android/app/src/main/AndroidManifest.xml
          grep -n "applicationId\|namespace\|versionCode\|versionName" android/app/build.gradle 2>/dev/null || true
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -f android/app/src/main/java/com/meimo/app/MainActivity.java
          echo "VERIFY OK"

      - name: Setup release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          chmod +x android-patches/setup-signing.sh
          bash android-patches/setup-signing.sh
          echo "---- app/build.gradle (signing section) ----"
          grep -n -A30 "signingConfigs" android/app/build.gradle || true
          echo "---- keystore files ----"
          ls -la android/keystore/

      - name: Build Release APK + AAB
        working-directory: android
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace --info 2>&1 | tee /tmp/gradle-release.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ]; then
            echo "======== GRADLE FAILURE SUMMARY ========"
            grep -n -i -E "FAILURE|error:|What went wrong|Execution failed|AAPT|resource|signing|not found|Exception" /tmp/gradle-release.log | tail -80
            echo "======== TAIL LOG ========"
            tail -100 /tmp/gradle-release.log
            exit "$STATUS"
          fi

      - name: List outputs
        run: find android/app/build/outputs -type f \( -name "*.apk" -o -name "*.aab" \) -ls

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: meimo-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload Release AAB (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: meimo-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
          if-no-files-found: error
