name: Build Android APK

on:
  push:
    branches: [main, master, v2]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      # package "tools" sudah dihapus Google → jangan install (penyebab exit code 1)
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Prepare www (webDir)
        run: npm run prepare:www

      - name: Add Capacitor Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Generate Android icons and splash (@capacitor/assets)
        run: |
          # resources/icon.png = source; background #1E1E1E (bukan putih)
          npm run assets
          echo "---- generated mipmap sample ----"
          find android/app/src/main/res -name "ic_launcher*" | head -30

      - name: Patch Android (plugins, permissions, package — NOT icons)
        run: |
          chmod +x android-patches/patch-android.sh
          bash android-patches/patch-android.sh

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Verify package + mic + icons present
        run: |
          grep -n "RECORD_AUDIO" android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/java/com/meimo/app/v2/MainActivity.java
          # Icon harus ada (dari capacitor-assets)
          find android/app/src/main/res -name "ic_launcher.png" | head -5
          echo "VERIFY OK"

      - name: Setup release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          chmod +x android-patches/setup-signing.sh
          bash android-patches/setup-signing.sh

      - name: Build Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-release.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ]; then
            echo "======== WHAT WENT WRONG ========"
            awk '/What went wrong:/{flag=1} flag{print} /Try:/{if(flag){exit}}' /tmp/gradle-release.log || true
            echo "======== OTHER ERRORS ========"
            grep -n "Execution failed\|Could not\|AAPT\|Signing\|Exception:" /tmp/gradle-release.log | grep -v "Resource missing" | tail -40 || true
            tail -40 /tmp/gradle-release.log
            exit "$STATUS"
          fi

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          # Branch v2 = side-by-side test package (com.meimo.app.v2)
          name: meimo-v2-test-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error
