name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Prepare www (webDir)
        run: npm run prepare:www

      - name: Add Capacitor Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Patch Android (plugins, permissions, styles)
        run: |
          set -euo pipefail

          PKG_DIR="android/app/src/main/java/com/meimo/notes"
          mkdir -p "$PKG_DIR"

          # Copy custom plugins
          for f in MeimoSystemBarsPlugin.java MeimoFileSaverPlugin.java NavigationBarPlugin.java; do
            if [ -f "android-patches/$f" ]; then
              cp "android-patches/$f" "$PKG_DIR/"
              echo "Copied $f"
            fi
          done

          # Register plugins in MainActivity
          MAIN=$(find android/app/src/main/java -name "MainActivity.java" | head -1)
          echo "MainActivity: $MAIN"
          if [ -n "$MAIN" ] && [ -f "$MAIN" ]; then
            # Ensure package + BridgeActivity
            if ! grep -q "registerPlugin" "$MAIN"; then
              # Rewrite MainActivity with explicit plugin registration
              cat > "$MAIN" << 'MAINJAVA'
package com.meimo.notes;

import android.os.Bundle;
import com.getcapacitor.BridgeActivity;

public class MainActivity extends BridgeActivity {
  @Override
  public void onCreate(Bundle savedInstanceState) {
    registerPlugin(MeimoSystemBarsPlugin.class);
    registerPlugin(MeimoFileSaverPlugin.class);
    registerPlugin(NavigationBarPlugin.class);
    super.onCreate(savedInstanceState);
  }
}
MAINJAVA
              echo "Rewrote MainActivity with plugins"
              cat "$MAIN"
            fi
          fi

          # Permissions
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if ! grep -q "WRITE_EXTERNAL_STORAGE" "$MANIFEST"; then
              sed -i 's|</manifest>|    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n</manifest>|' "$MANIFEST" || true
            fi
            # requestLegacyExternalStorage for older write paths
            if ! grep -q "requestLegacyExternalStorage" "$MANIFEST"; then
              sed -i 's|<application|<application android:requestLegacyExternalStorage="true"|' "$MANIFEST" || true
            fi
            echo "--- Manifest head ---"
            head -50 "$MANIFEST"
          fi

          # Styles: solid system bars
          for STYLES in android/app/src/main/res/values/styles.xml android/app/src/main/res/values/themes.xml; do
            if [ -f "$STYLES" ]; then
              echo "Patching $STYLES"
              if ! grep -q "navigationBarColor" "$STYLES"; then
                sed -i 's|</style>|        <item name="android:navigationBarColor">#17181C</item>\n        <item name="android:statusBarColor">#17181C</item>\n        <item name="android:windowLightStatusBar">false</item>\n        <item name="android:windowLightNavigationBar">false</item>\n        <item name="android:windowDrawsSystemBarBackgrounds">true</item>\n    </style>|' "$STYLES" || true
              fi
              cat "$STYLES"
            fi
          done

          # List plugins in java package
          ls -la "$PKG_DIR" || true

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: meimo-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error
