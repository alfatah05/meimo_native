<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8">
<style>
@view-transition {
  navigation: auto;
}
</style>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<title>Shared — Meimo</title>

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1E1E1E">
<script>
  (function () {
    var THEME_COLORS = { light: "#FFFFFF", dark: "#17181C", sepia: "#F4ECD8", paper: "#FBFAF5", oled: "#000000" };
    try {
      var t = localStorage.getItem("notes-app-theme");
      if (t) document.documentElement.setAttribute("data-theme", t);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", THEME_COLORS[t] || THEME_COLORS.light);
    } catch (e) {}
  })();
</script>
<link rel="icon" href="/assets/icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/assets/icons/icon-512.png">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meimo">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/css/variables.css">
<link rel="stylesheet" href="/src/css/themes.css">
<link rel="stylesheet" href="/src/css/view-transitions.css">
<link rel="stylesheet" href="/src/css/base.css">
<link rel="stylesheet" href="/src/css/typography.css">
<link rel="stylesheet" href="/src/css/layout.css">
<link rel="stylesheet" href="/src/css/notes-list.css">
<link rel="stylesheet" href="/src/css/toolbar.css">
<link rel="stylesheet" href="/src/css/animations.css">
<link rel="stylesheet" href="/src/css/responsive.css">
<link rel="stylesheet" href="/src/css/components.css">
<link rel="stylesheet" href="/src/css/skeleton.css">
<link rel="stylesheet" href="/src/css/settings.css">
</head>
<body>

<div class="page">

  <header class="home-header">
    <div style="display:flex; align-items:center; gap: var(--space-sm);">
      <a href="/library" class="note-back-btn" aria-label="Back" data-i18n-aria="nav.back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </a>
      <div class="home-greeting" data-i18n="shared.title">Shared</div>
    </div>
  </header>

  <main class="home-content">

    <section class="section" style="margin-bottom: var(--space-md);">
      <button type="button" id="sharedJoinToggle" class="settings-row" style="width:100%; text-align:left; border:none; cursor:pointer;" aria-expanded="false" aria-controls="sharedJoinPanel">
        <span class="settings-row__text">
          <span class="settings-row__title" data-i18n="shared.join.toggle">Join a shared note</span>
          <span class="settings-row__desc" data-i18n="shared.join.toggleDesc">Enter note ID, access code, and your name</span>
        </span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
      <div id="sharedJoinPanel" hidden style="padding: var(--space-md); background: var(--color-surface); border-radius: var(--radius-md); margin-top: var(--space-sm);">
        <form id="sharedJoinForm">
          <label class="settings-row__desc" for="joinNoteId" data-i18n="shared.join.noteId">Note ID</label>
          <input id="joinNoteId" class="search-bar__input" type="text" autocomplete="off" spellcheck="false" style="width:100%; margin: var(--space-xs) 0 var(--space-sm);" />
          <label class="settings-row__desc" for="joinAccessCode" data-i18n="shared.join.code">Access code (8 characters)</label>
          <input id="joinAccessCode" class="search-bar__input" type="text" maxlength="8" autocomplete="off" spellcheck="false" style="width:100%; margin: var(--space-xs) 0 var(--space-sm);" />
          <label class="settings-row__desc" for="joinDisplayName" data-i18n="shared.join.name">Your name (letters only, min 3)</label>
          <input id="joinDisplayName" class="search-bar__input" type="text" autocomplete="name" style="width:100%; margin: var(--space-xs) 0 var(--space-md);" />
          <button type="submit" id="joinSubmit" class="fab-action fab-action--primary" style="width:100%; justify-content:center;" data-i18n="shared.join.submit">Join</button>
        </form>
      </div>
    </section>

    <div id="sharedSectionSkeleton" class="list-skeleton skeleton-overlay" aria-hidden="true">
      <div class="skeleton-bar list-skeleton__row"></div>
      <div class="skeleton-bar list-skeleton__row"></div>
      <div class="skeleton-bar list-skeleton__row"></div>
    </div>

    <section id="sharedSection" class="section" hidden>
      <div class="section-header">
        <span class="section-title" data-i18n="shared.section">Shared notes</span>
      </div>
      <div id="sharedGrid" class="notes-grid"></div>
    </section>

    <div id="sharedEmptyState" class="empty-state anim-fade-in" hidden>
      <svg class="empty-state__illustration" viewBox="0 0 96 96" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="36" cy="40" r="14"></circle>
        <circle cx="60" cy="40" r="14"></circle>
        <path d="M22 70c4-10 12-16 14-16s10 6 14 16"></path>
        <path d="M46 70c4-10 12-16 14-16s10 6 14 16"></path>
      </svg>
      <div class="empty-state__title" data-i18n="shared.empty.title">No shared notes</div>
      <p class="empty-state__desc" data-i18n="shared.empty.desc">Notes you share or join will appear here.</p>
    </div>

  </main>

</div>

<script type="module" src="/src/js/notes/shared.js"></script>
<script type="module" src="/src/js/pwa/sw-register.js"></script>
<script type="module" src="/src/js/pwa/install-prompt.js"></script>
<script type="module" src="/src/js/utils/native-feel.js"></script>

</body>
</html>
