<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">
<style>
/* Opt-in View Transition — harus inline paling atas.
   Animasi page-in/out dari src/css/view-transitions.css (sama seperti page lain). */
@view-transition {
  navigation: auto;
}
</style>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<title>Customisasi Kartu — Catatan</title>

<!-- ============ PWA: Manifest, Theme Color, App Icon, Splash Screen ============ -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1E1E1E">
<script>
  // Terapkan tema tersimpan SEBELUM stylesheet dirender, supaya tidak ada
  // kedip ke tema default — sekalian sinkronkan warna status bar
  // (meta theme-color) dengan warna background tema tersebut. Peta warna
  // di bawah HARUS sama dengan `swatch` di THEMES (lihat
  // src/js/themes/theme-manager.js) & --color-bg per tema di
  // src/css/themes.css.
  (function () {
    var THEME_COLORS = { light: "#FFFFFF", dark: "#17181C", sepia: "#F4ECD8", paper: "#FBFAF5", oled: "#000000" };
    try {
      var t = localStorage.getItem("notes-app-theme");
      if (t) document.documentElement.setAttribute("data-theme", t);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", THEME_COLORS[t] || THEME_COLORS.light);
    } catch (e) {}
  })();
  // Capture pagereveal untuk boot() menunggu animasi selesai sebelum DOM berat.
  window.addEventListener("pagereveal", function (e) {
    window.__MEIMO_PAGE_REVEAL__ = e;
  });
</script>
<link rel="icon" href="/assets/icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/assets/icons/icon-512.png">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<link rel="apple-touch-startup-image" href="/assets/splash/splash-screen.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meimo">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/css/variables.css">
<link rel="stylesheet" href="/src/css/themes.css">
<link rel="stylesheet" href="/src/css/view-transitions.css">
<link rel="stylesheet" href="/src/css/base.css">
<link rel="stylesheet" href="/src/css/typography.css">
<link rel="stylesheet" href="/src/css/layout.css">
<!-- notes-list + toolbar: cuma butuh untuk preview note-card, di-load setelah VT -->
<link rel="stylesheet" href="/src/css/animations.css">
<link rel="stylesheet" href="/src/css/responsive.css">
<link rel="stylesheet" href="/src/css/components.css">
<link rel="stylesheet" href="/src/css/skeleton.css">
<link rel="stylesheet" href="/src/css/card-style.css">
</head>
<body>

<div class="page">

  <!-- ============ HEADER ============ -->
  <header class="home-header">
    <div style="display:flex; align-items:center; gap: var(--space-sm);">
      <a href="/library" class="note-back-btn" aria-label="Back" data-i18n-aria="nav.back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </a>
      <div class="home-greeting" data-i18n="cardStyle.title">Card customization</div>
    </div>
  </header>

  <!-- ============ CONTENT ============ -->
  <!-- Dirender & dikelola oleh src/js/notes/card-style.js. Pratinjau kartu
       (#cardPreviewSlot) memakai fungsi render kartu yang sama dengan Notes
       List (createNoteCard di notes/note-card.js) supaya hasilnya identik
       persis dengan tampilan di Home. -->
  <main class="home-content card-style-page">

    <!-- Skeleton loading: boot() di card-style.js nunggu loadNote() +
         ensureInstalledFontsLoaded()/getAvailableFonts() (IndexedDB) dulu
         sebelum apa pun dirender, jadi tanpa ini halaman kelihatan
         kosong/kedip putih sesaat. Bentuknya sengaja disamakan section per
         section dengan layout ASLI di bawah (Pratinjau, Font Judul, Bentuk
         Edge, Warna Latar, Gambar Latar) — beda dari skeleton grid kartu
         (Home) atau skeleton baris list generik (Font Library/Cadangkan/
         Sampah). Ditampilkan by default sejak first paint (tanpa nunggu
         JS), disembunyikan begitu render pertama selesai (lihat boot()
         di card-style.js). -->
    <div id="cardStyleSkeleton" class="list-skeleton skeleton-overlay card-style-skeleton--simple" aria-hidden="true">
      <div class="skeleton-bar list-skeleton__row"></div>
      <div class="skeleton-bar list-skeleton__row"></div>
      <div class="skeleton-bar list-skeleton__row"></div>
    </div>

    <section class="section">
      <div class="section-header">
        <span class="section-title" data-i18n="cardStyle.preview">Preview</span>
      </div>
      <div id="cardPreviewSlot" class="card-style-preview"></div>
    </section>

    <section class="section">
      <div class="section-header">
        <span class="section-title" data-i18n="cardStyle.titleFont">Title font</span>
      </div>
      <button type="button" id="fontSelect" class="card-style-select card-style-select--custom" aria-haspopup="listbox" aria-expanded="false">
        <span id="fontSelectLabel" class="card-style-select__label">Default</span>
        <svg class="card-style-select__chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </button>
    </section>

    <section class="section">
      <div class="section-header">
        <span class="section-title" data-i18n="cardStyle.edge">Edge shape</span>
      </div>
      <div id="edgeShapeList" class="card-style-shape-scroll"></div>
    </section>

    <section class="section">
      <div class="section-header">
        <span class="section-title" data-i18n="cardStyle.bgColor">Background color</span>
      </div>
      <div class="card-style-color-scroll">
        <div id="bgColorList" class="card-style-color-scroll__presets"></div>
        <label class="card-style-color-swatch card-style-color-swatch--custom" title="Warna kustom">
          <input type="color" id="bgColorCustom" value="#4A55C7">
        </label>
      </div>
    </section>

    <section class="section">
      <div class="section-header">
        <span class="section-title" data-i18n="cardStyle.bgImage">Background image <span class="card-style-optional-tag" data-i18n="cardStyle.optional">(optional)</span></span>
      </div>
      <div class="card-style-bg-image">
        <input type="file" id="bgImageInput" accept="image/*" hidden>
        <button type="button" id="bgImageUploadBtn" class="card-style-btn card-style-btn--primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M12 4l-4 4M12 4l4 4"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
          <span data-i18n="cardStyle.uploadImage">Upload image</span>
        </button>
        <button type="button" id="bgImageRemoveBtn" class="card-style-btn card-style-btn--danger" hidden>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>
          <span data-i18n="cardStyle.removeImage">Remove image</span>
        </button>
      </div>
      <div id="bgImageOpacityRow" class="card-style-opacity-row" hidden>
        <label for="bgImageOpacity" class="card-style-opacity-row__label" data-i18n="cardStyle.opacity">Opacity</label>
        <input type="range" id="bgImageOpacity" min="0" max="1" step="0.05" value="1">
        <span id="bgImageOpacityValue" class="card-style-opacity-row__value">100%</span>
      </div>
    </section>

    <section class="section">
      <div class="card-style-toggle-row">
        <div class="card-style-toggle-row__text">
          <span class="section-title" data-i18n="cardStyle.hideSnippet">Hide note content</span>
          <span class="card-style-toggle-row__hint" data-i18n="cardStyle.hideSnippetHint">Show title only on the card</span>
        </div>
        <button type="button" id="hideSnippetToggle" class="card-style-toggle" role="switch" aria-checked="false" aria-label="Hide note content">
          <span class="card-style-toggle__knob" aria-hidden="true"></span>
        </button>
      </div>
    </section>

  </main>

  <!-- ============ ACTION BAR ============ -->
  <div class="card-style-actionbar">
    <button type="button" id="resetBtn" class="modal-btn modal-btn--ghost" data-i18n="cardStyle.reset">Reset</button>
    <button type="button" id="saveBtn" class="modal-btn modal-btn--primary" data-i18n="cardStyle.save">Save</button>
  </div>

</div>

<!-- Modul berat (note-card, font-service, presets clip-path, document-service)
     SENGAJA di-import SETELAH View Transition selesai. Kalau di-load paralel
     dengan animasi page-in, parse/compile JS di main thread bikin frame drop
     — terasa "patah-patah" selama skeleton masih tampil. Page font-manager/
     editor import graph-nya lebih ringan jadi tidak kena. -->
<script type="module">
(async function () {
  function waitVt() {
    return new Promise(function (resolve) {
      var done = false;
      function finish() {
        if (done) return;
        done = true;
        resolve();
      }
      var e = window.__MEIMO_PAGE_REVEAL__;
      if (e && e.viewTransition && e.viewTransition.finished) {
        e.viewTransition.finished.then(finish).catch(finish);
        setTimeout(finish, 500);
        return;
      }
      function onReveal(ev) {
        window.removeEventListener("pagereveal", onReveal);
        window.__MEIMO_PAGE_REVEAL__ = ev;
        if (ev && ev.viewTransition && ev.viewTransition.finished) {
          ev.viewTransition.finished.then(finish).catch(finish);
          setTimeout(finish, 500);
        } else {
          setTimeout(finish, 400);
        }
      }
      window.addEventListener("pagereveal", onReveal);
      setTimeout(finish, 500);
    });
  }

  await waitVt();

  // CSS yang cuma dipakai preview kartu — load setelah animasi biar parse CSS
  // tidak tabrakan dengan frame View Transition.
  function loadCss(href) {
    return new Promise(function (resolve) {
      var l = document.createElement("link");
      l.rel = "stylesheet";
      l.href = href;
      l.onload = function () { resolve(); };
      l.onerror = function () { resolve(); };
      document.head.appendChild(l);
    });
  }
  await Promise.all([
    loadCss("/src/css/notes-list.css"),
    loadCss("/src/css/toolbar.css"),
  ]);

  // Baru sekarang load modul berat + boot
  await import("/src/js/notes/card-style.js");
  // PWA helpers (ringan) — boleh paralel setelah page settled
  import("/src/js/pwa/sw-register.js").catch(function () {});
  import("/src/js/pwa/install-prompt.js").catch(function () {});
  import("/src/js/utils/native-feel.js").catch(function () {});
})();
</script>

</body>
</html>
